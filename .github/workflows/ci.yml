name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (offline)
        run: uv run --extra dev pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff
        run: |
          uvx ruff check src scripts tests
          uvx ruff format --check src scripts tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and run the installed CLI
        run: |
          uv build
          uv run --isolated --no-project --with dist/*.whl legalize-mx --help
          uv run --isolated --no-project --with dist/*.whl python -c "import legalize_mx_mcp.server"
      - name: Plugin manifests are valid JSON with matching versions
        run: |
          python3 - <<'EOF'
          import json, tomllib
          plugin = json.load(open(".claude-plugin/plugin.json"))
          market = json.load(open(".claude-plugin/marketplace.json"))
          json.load(open(".mcp.json"))
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert plugin["version"] == version, (plugin["version"], version)
          assert market["plugins"][0]["version"] == version
          print("ok", version)
          EOF
