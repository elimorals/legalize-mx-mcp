[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legalize-mx-mcp"
version = "0.1.0"
description = "MCP server y CLI para consultar la legislación mexicana (federal, estatal y municipal) versionada en git."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elías Rashid Morales Mendoza" }]
dependencies = [
    "httpx>=0.27,<1.0",
    "mcp>=1.2,<2.0",
]

[project.optional-dependencies]
# Live extraction of PDFs when poppler's pdftotext is not installed.
pdf = ["pypdf>=4.0,<7.0"]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
legalize-mx = "legalize_mx_mcp.cli:main"
legalize-mx-mcp = "legalize_mx_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legalize_mx_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
